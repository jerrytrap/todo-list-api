name: build-and-push

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v4
      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jerrytrap/todo-list-api:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 배포 명령 전송
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=["cd /home/ubuntu/app","docker compose pull app","docker compose up -d","docker compose ps"]' \
            --query "Command.CommandId" --output text)
          echo "id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: 결과 확인
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true
          
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "{status:Status,details:StatusDetails,code:ResponseCode,out:StandardOutputContent,err:StandardErrorContent}" \
            --output json > result.json

          STATUS=$(jq -r '.status' result.json)

          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            jq -r '.out' result.json
          else
            echo "Deployment failed"
            jq -r '"Status: \(.status)\nDetails: \(.details)\nResponseCode: \(.code)\n\nStandard Output:\n\(.out)\n\nStandard Error:\n\(.err)"' result.json
            exit 1
          fi