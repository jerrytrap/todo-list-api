spring:
  application:
    name: todo-list-api

  profiles:
    active: dev

auth:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900} # 15분

  refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION_SECONDS:604800} # 7일

rate-limit:
  max-requests: ${RATE_LIMIT_MAX_REQUESTS:100}
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}