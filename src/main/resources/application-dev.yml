spring:
  datasource:
    url: ${DEV_DB_URL:jdbc:mysql://localhost:3306/todo_dev}
    username: ${DEV_DB_USERNAME:dev}
    password: ${DEV_DB_PASSWORD:pwd1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookie:
    secure: false
    same-site: Lax
