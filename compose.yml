services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/todo_dev
      SPRING_DATASOURCE_USERNAME: ${DEV_DB_USERNAME:-dev}
      SPRING_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD:-pwd1234}
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: todo_dev
      MYSQL_USER: ${DEV_DB_USERNAME:-dev}
      MYSQL_PASSWORD: ${DEV_DB_PASSWORD:-pwd1234}
      MYSQL_ROOT_PASSWORD: ${DEV_DB_ROOT_PASSWORD:-root1234}
    ports:
      - "3306:3306"
    volumes:
      - todo-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  todo-data: